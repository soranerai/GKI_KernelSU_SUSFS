name: 'Setup Build Environment'
description: 'Clones dependencies and exports mkbootimg/avbtool paths'

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        mkdir -p "${{ github.workspace }}/kernel"
        if command -v repo &>/dev/null; then
          echo "✅ repo is already installed in the system."
        else
          mkdir -p "${{ github.workspace }}/git-repo"
          echo "Downloading repo tool from Google Storage..."
          if curl -LfsS --connect-timeout 15 https://storage.googleapis.com/git-repo-downloads/repo -o "${{ github.workspace }}/git-repo/repo"; then
            chmod +x "${{ github.workspace }}/git-repo/repo"
            echo "${{ github.workspace }}/git-repo" >> "$GITHUB_PATH"
          else
            echo "⚠️ Failed to download repo from Google storage, attempting fallback to Tsinghua mirror..."
            if curl -LfsS --connect-timeout 15 https://mirrors.tuna.tsinghua.edu.cn/git/git-repo -o "${{ github.workspace }}/git-repo/repo"; then
              chmod +x "${{ github.workspace }}/git-repo/repo"
              echo "${{ github.workspace }}/git-repo" >> "$GITHUB_PATH"
            else
              echo "❌ ERROR: Failed to download repo tool. Please install it on the host via 'sudo apt install repo'"
              exit 1
            fi
          fi
        fi

        if [ -d "${{ github.workspace }}/kernel_patches" ]; then rm -rf "${{ github.workspace }}/kernel_patches"; fi
        git clone https://github.com/WildKernels/kernel_patches.git "${{ github.workspace }}/kernel_patches"

        if [ -d "${{ github.workspace }}/AnyKernel3" ]; then rm -rf "${{ github.workspace }}/AnyKernel3"; fi
        git clone https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 "${{ github.workspace }}/AnyKernel3"
        
