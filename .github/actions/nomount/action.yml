name: 'Setup NoMount'
description: 'Integrate NoMount VFS hooks and enable CONFIG_NOMOUNT'

runs:
  using: composite
  steps:
    - name: Integrate NoMount
      shell: bash
      run: |
        set -euo pipefail

        KERNEL_DIR="${{ github.workspace }}/kernel/common"

        test -d "$KERNEL_DIR"
        cd "$KERNEL_DIR"
        curl --fail --location --silent --show-error \
          https://raw.githubusercontent.com/maxsteeel/nomount/dev/kernel/setup.sh \
          | bash -s dev
        test -L "$KERNEL_DIR/fs/nomount"
        test -f "$KERNEL_DIR/fs/nomount/Kconfig"
        grep -qxF 'obj-$(CONFIG_NOMOUNT) += nomount/' "$KERNEL_DIR/fs/Makefile"
        grep -qxF 'source "fs/nomount/Kconfig"' "$KERNEL_DIR/fs/Kconfig"
        echo "NoMount integrated using upstream setup.sh (branch dev)"

    - name: Enable NoMount in kernel defconfig
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_NOMOUNT=y
